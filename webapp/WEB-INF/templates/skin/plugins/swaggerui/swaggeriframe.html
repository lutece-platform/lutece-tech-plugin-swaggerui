<!DOCTYPE html>
<html lang="${locale}">
<head>
    <meta charset="utf-8">
    <title>#i18n{swaggerui.swaggeriframe.title}</title>
    <link rel="stylesheet" href="${base_url}css/plugins/swaggerui/swagger-ui.css">
</head>
<body>
    <main>
        <div class="swagger-ui">
            <div class="wrapper">
                <label for="swagger-select">#i18n{swaggerui.swaggeriframe.selectLabel}</label>
                <select id="swagger-select" data-oauth2-redirect-url="${base_url}js/plugins/swaggerui/swagger-ui/oauth2-redirect.html">
                    <#list swagger_files_list as swagger_file>
                    <option value="${swagger_file.path}">Plugin ${swagger_file.pluginName} - ${swagger_file.version}</option>
                    </#list>
                </select>
            </div>
        </div>
        <div id="swagger-ui-container"></div>
    </main>
    <script src="${base_url}js/plugins/swaggerui/swagger-ui/swagger-ui-bundle.js"></script>
    <script src="${base_url}js/plugins/swaggerui/swaggerui.js"></script>
</body>
</html>
